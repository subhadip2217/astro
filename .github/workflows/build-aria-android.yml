name: Build Aria Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-aria-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Aria launcher icon
        working-directory: .
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          base64 -d android/icon/aria_icon_512.png.b64 > android/app/src/main/res/mipmap-mdpi/aria_icon.webp
          file android/app/src/main/res/mipmap-mdpi/aria_icon.webp

      - name: Write google-services.json
        working-directory: .
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing secret GOOGLE_SERVICES_JSON. Add the full contents of Firebase google-services.json as a repository secret."
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json written"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
